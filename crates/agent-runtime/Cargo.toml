[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Генерик runtime агента: внутренний IR, учёт контекста и политика инструментов. Без genai/rmcp/ACP в зависимостях — они подключаются адаптерами снаружи."
readme = "README.md"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = { version = "0.7" }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
