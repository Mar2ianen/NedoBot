name: release
# Single release binary for every instance (default cargo features).
# Built on ubuntu-24.04 so glibc matches the production host (2.39);
# developers on newer distros must not ship locally built binaries.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (production requires an annotated deploy-YYYY-MM-DD-scope tag)"
        default: "main"
        required: true
      deploy:
        description: "Copy binaries to vps-153 and restart services"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nedobot-production-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      migration_version: ${{ steps.source.outputs.migration_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Record source and verify production deploy tag
        id: source
        env:
          DEPLOY_REQUESTED: ${{ inputs.deploy }}
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          migration_version=$(find migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]+)_.*/\1/' | sort -n | tail -1)
          if ! [[ "$migration_version" =~ ^[0-9]+$ ]]; then
            echo "could not determine latest SQLx migration version" >&2
            exit 1
          fi
          echo "migration_version=$migration_version" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY_REQUESTED" = true ]; then
            test "$GITHUB_REF" = refs/heads/main
            [[ "$SOURCE_REF" =~ ^(refs/tags/)?deploy-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9][a-z0-9-]*$ ]]
            tag="refs/tags/${SOURCE_REF#refs/tags/}"
            test "$(git cat-file -t "$tag")" = tag
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
            git merge-base --is-ancestor HEAD origin/main
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release (default features = full single binary)
        run: cargo build --locked --release
      - name: Guard production glibc compatibility (<= 2.39)
        run: |
          max_glibc=$(objdump -T target/release/tg_ai_bot_teloxide \
            | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          echo "max required glibc: $max_glibc"
          if [ "$(printf '%s\n%s\n' "$max_glibc" "GLIBC_2.39" | sort -V | tail -1)" != "GLIBC_2.39" ]; then
            echo "binary requires newer glibc than production (2.39)" >&2
            exit 1
          fi
      - name: Collect artifacts
        run: |
          bash scripts/release_bundle.sh pack target/release dist
          while IFS= read -r binary; do
            dependencies=$(readelf -d "dist/$binary")
            if grep -Eq 'NEEDED.*\[lib(ssl|crypto)\.so' <<< "$dependencies"; then
              echo "unexpected OpenSSL dependency: $binary" >&2
              exit 1
            fi
          done < <(bash dist/install_release_binaries.sh --list-binaries)
          rustc --version > dist/BUILD_INFO.txt
          git rev-parse HEAD >> dist/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nedobot-release-${{ steps.source.outputs.commit }}
          path: dist/
          retention-days: 30

  deploy:
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nedobot-release-${{ needs.build.outputs.commit }}
          path: dist/
      - name: Verify artifact checksums
        run: |
          ( cd dist && sha256sum --strict -c SHA256SUMS )
          bash dist/release_bundle.sh verify dist
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Stage binaries on production host
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          stage="$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'mktemp -d')"
          if ! scp -pr -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              dist "$VPS_USER@$VPS_HOST:$stage/" \
            || ! scp -p -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              dist/set_privacy_mode_observe.sh "$VPS_USER@$VPS_HOST:$stage/dist/"; then
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" "rm -rf -- '$stage'"
            exit 1
          fi
          echo "STAGE_DIR=$stage" >> "$GITHUB_ENV"
      - name: Atomic install, restart, verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          EXPECTED_MIGRATION_VERSION: ${{ needs.build.outputs.migration_version }}
        run: |
          if ! [[ "$EXPECTED_MIGRATION_VERSION" =~ ^[0-9]+$ ]]; then
            echo "invalid expected migration version" >&2
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$STAGE_DIR' '$EXPECTED_MIGRATION_VERSION'" <<'REMOTE'
          set -euo pipefail
          stage_dir="$1"
          expected_migration_version="$2"
          backup_dir=""
          deployment_complete=false
          cleanup_stage_on_exit() {
            status=$?
            trap - EXIT
            if [ -n "$stage_dir" ] && [ -d "$stage_dir" ]; then
              rm -rf -- "$stage_dir"
            fi
            exit "$status"
          }
          trap cleanup_stage_on_exit EXIT
          deploy_started_at=$(date --iso-8601=seconds)
          main_restarts_before=$(systemctl show tg-ai-bot-teloxide -p NRestarts --value)
          pvo_restarts_before=$(systemctl show nedobot-pvo -p NRestarts --value)
          mcp_restarts_before=$(systemctl show nedonews-mcp -p NRestarts --value)
          for unit in tg-ai-bot-teloxide nedobot-pvo nedonews-mcp; do
            systemctl is-active --quiet "$unit"
          done
          bash "$stage_dir/dist/release_bundle.sh" verify "$stage_dir/dist"
          expected_bot_sha=$(awk '$2 == "tg_ai_bot_teloxide" {print $1}' "$stage_dir/dist/SHA256SUMS")
          expected_mcp_sha=$(awk '$2 == "nedonews_mcp_http" {print $1}' "$stage_dir/dist/SHA256SUMS")
          test -n "$expected_bot_sha"
          test -n "$expected_mcp_sha"
          assert_database_at_expected_migration() {
            database="$1"
            migration_state="$(podman exec tg-ai-bot-postgres psql -XAt \
              -v ON_ERROR_STOP=1 -U tg_ai_bot -d "$database" \
              -c "select coalesce(max(version), 0)::text || ':' || (exists (select 1 from _sqlx_migrations where not success))::text from _sqlx_migrations where success" \
              2>/dev/null)" || {
                echo "could not read migration state for $database; refusing deployment" >&2
                return 1
              }
            if [ "$migration_state" != "$expected_migration_version:false" ]; then
              echo "database $database is not clean at expected migration $expected_migration_version; refusing deployment" >&2
              return 1
            fi
          }
          # Приложение запускает SQLx migrations при старте. Запрещаем незаметно
          # менять production schema при выкладке бинаря; для этого нужна отдельная
          # операторская процедура с backup.
          assert_database_at_expected_migration tg_ai_bot
          assert_database_at_expected_migration tg_ai_bot_pvo
          # Preflight uses systemd's EnvironmentFile parser, exactly like each service.
          # Profiles and secrets are operator-owned and are never overwritten by CI.
          for instance in tg-ai-bot-teloxide nedobot-pvo; do
            if [ "$instance" = tg-ai-bot-teloxide ]; then
              profile=/etc/tg-ai-bot/llm_profiles.toml
            else
              profile=/etc/tg-ai-bot/pvo-llm_profiles.toml
            fi
            systemd-run --quiet --wait --pipe --collect \
              --property="WorkingDirectory=/opt/$instance" \
              --property="EnvironmentFile=/opt/$instance/.env" \
              --setenv="LLM_PROFILES_PATH=$profile" \
              "$stage_dir/dist/validate_instance_config"
          done

          rollback_on_failure() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ "$deployment_complete" != true ] \
              && [ -n "$backup_dir" ] && [ -d "$backup_dir" ]; then
              echo "deployment failed; restoring the verified pre-deploy backup"
              set +e
              bash "$stage_dir/dist/install_release_binaries.sh" --restore "$backup_dir"
              restore_status=$?
              if [ "$restore_status" -eq 0 ]; then
                systemctl restart tg-ai-bot-teloxide
                main_rollback_status=$?
                systemctl restart nedobot-pvo
                pvo_rollback_status=$?
                systemctl restart nedonews-mcp
                mcp_rollback_status=$?
                systemctl is-active --quiet tg-ai-bot-teloxide
                main_active_status=$?
                systemctl is-active --quiet nedobot-pvo
                pvo_active_status=$?
                systemctl is-active --quiet nedonews-mcp
                mcp_active_status=$?
                old_main_sha=$(sha256sum "$backup_dir/tg-ai-bot-teloxide/tg_ai_bot_teloxide" | awk '{print $1}')
                old_pvo_sha=$(sha256sum "$backup_dir/nedobot-pvo/tg_ai_bot_teloxide" | awk '{print $1}')
                old_mcp_sha=$(sha256sum "$backup_dir/tg-ai-bot-teloxide/nedonews_mcp_http" | awk '{print $1}')
                main_pid=$(systemctl show tg-ai-bot-teloxide -p MainPID --value)
                pvo_pid=$(systemctl show nedobot-pvo -p MainPID --value)
                mcp_pid=$(systemctl show nedonews-mcp -p MainPID --value)
                restored_main_sha=$(sha256sum "/proc/$main_pid/exe" | awk '{print $1}')
                restored_pvo_sha=$(sha256sum "/proc/$pvo_pid/exe" | awk '{print $1}')
                restored_mcp_sha=$(sha256sum "/proc/$mcp_pid/exe" | awk '{print $1}')
                if [ "$main_rollback_status" -ne 0 ] || [ "$pvo_rollback_status" -ne 0 ] \
                  || [ "$mcp_rollback_status" -ne 0 ] || [ "$main_active_status" -ne 0 ] \
                  || [ "$pvo_active_status" -ne 0 ] || [ "$mcp_active_status" -ne 0 ] \
                  || [ "$restored_main_sha" != "$old_main_sha" ] \
                  || [ "$restored_pvo_sha" != "$old_pvo_sha" ] \
                  || [ "$restored_mcp_sha" != "$old_mcp_sha" ]; then
                  echo "automatic rollback did not restore every service; operator intervention required" >&2
                fi
              else
                echo "automatic binary/config rollback failed; operator intervention required" >&2
              fi
            fi
            if [ -d "$stage_dir" ]; then
              rm -rf -- "$stage_dir"
            fi
            exit "$status"
          }
          trap rollback_on_failure EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          install_output=""
          install_status=0
          install_output="$(bash "$stage_dir/dist/install_release_binaries.sh" "$stage_dir/dist" --backup)" \
            || install_status=$?
          backup_dir="$(printf '%s\n' "$install_output" \
            | sed -n 's/^verified rollback backup: //p' | tail -n 1)"
          printf '%s\n' "$install_output"
          if [ "$install_status" -ne 0 ]; then
            exit "$install_status"
          fi
          test -n "$backup_dir"
          ( cd "$backup_dir" && sha256sum --strict --check --status SHA256SUMS )

          for instance in tg-ai-bot-teloxide nedobot-pvo; do
            bash "$stage_dir/dist/set_privacy_mode_observe.sh" "/opt/$instance/.env"
            policy_value="$(systemd-run --quiet --wait --pipe --collect \
              --property="EnvironmentFile=/opt/$instance/.env" \
              /usr/bin/env | awk -F= '$1 == "NEDOBOT_PRIVACY_MODE_POLICY" {print $2}')"
            test "$policy_value" = observe
          done

          assert_unit_binary() {
            unit="$1"
            expected_sha="$2"
            baseline_restarts="$3"
            systemctl is-active --quiet "$unit"
            test "$(systemctl show "$unit" -p NRestarts --value)" = "$baseline_restarts"
            pid="$(systemctl show "$unit" -p MainPID --value)"
            test "$pid" -gt 1
            actual_sha="$(sha256sum "/proc/$pid/exe" | awk '{print $1}')"
            test "$actual_sha" = "$expected_sha"
          }
          # systemd reports a Type=simple service as started while MainPID can
          # still be the short-lived systemd-executor that has not exec'd the
          # service binary yet. Poll until the expected executable is running.
          wait_for_unit_binary() {
            unit="$1"
            expected_sha="$2"
            baseline_restarts="$3"
            for attempt in $(seq 1 300); do
              if assert_unit_binary "$unit" "$expected_sha" "$baseline_restarts"; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          assert_privacy_policy() {
            unit="$1"
            pid="$(systemctl show "$unit" -p MainPID --value)"
            policy_value="$(tr '\0' '\n' < "/proc/$pid/environ" \
              | awk -F= '$1 == "NEDOBOT_PRIVACY_MODE_POLICY" {print $2}')"
            test "$policy_value" = observe
          }

          wait_for_database() {
            database="$1"
            unit="$2"
            expected_sha="$3"
            baseline_restarts="$4"
            ready=false
            for attempt in $(seq 1 300); do
              database_ready=false
              if assert_unit_binary "$unit" "$expected_sha" "$baseline_restarts"; then
                database_ready=$(podman exec tg-ai-bot-postgres psql -XAt \
                -U tg_ai_bot -d "$database" \
                -c "select to_regclass('public.telegram_message_embeddings_gemma2') is not null and to_regclass('public.spammer_avatar_embeddings') is not null and to_regclass('public.telegram_messages_userstatus_totals_idx') is not null and exists (select 1 from _sqlx_migrations where version = 20261009190000 and success) and exists (select 1 from _sqlx_migrations where version = 20261018120000 and success) and exists (select 1 from _sqlx_migrations where version = $expected_migration_version and success) and not exists (select 1 from _sqlx_migrations where not success)" 2>/dev/null) \
                || database_ready=false
              fi
              if [ "$database_ready" = "t" ]; then
                ready=true
                break
              fi
              sleep 2
            done
            test "$ready" = true
          }

          journal_has_errors() {
            unit="$1"
            error_lines="$(journalctl --quiet -u "$unit" --since "$deploy_started_at" --no-pager -p err -o cat)"
            journal_status=$?
            if [ "$journal_status" -ne 0 ]; then
              return 2
            fi
            if [ -n "$error_lines" ]; then
              return 0
            fi
            log_lines="$(journalctl --quiet -u "$unit" --since "$deploy_started_at" --no-pager -o cat)"
            journal_status=$?
            if [ "$journal_status" -ne 0 ]; then
              return 2
            fi
            if grep -Eq '(^|[[:space:]])ERROR([[:space:]:]|$)' <<< "$log_lines"; then
              return 0
            fi
            return 1
          }

          assert_no_journal_errors() {
            for unit in "$@"; do
              if journal_has_errors "$unit"; then
                echo "error-level journal entry observed for $unit; deployment health gate failed" >&2
                return 1
              else
                journal_status=$?
                if [ "$journal_status" -ne 1 ]; then
                  echo "could not verify the journal for $unit; deployment health gate failed" >&2
                  return "$journal_status"
                fi
              fi
            done
          }

          # Keep the two polling services on separate restart/health steps.
          systemctl restart tg-ai-bot-teloxide
          wait_for_database tg_ai_bot tg-ai-bot-teloxide "$expected_bot_sha" "$main_restarts_before"
          assert_privacy_policy tg-ai-bot-teloxide
          assert_no_journal_errors tg-ai-bot-teloxide

          systemctl restart nedobot-pvo
          wait_for_database tg_ai_bot_pvo nedobot-pvo "$expected_bot_sha" "$pvo_restarts_before"
          assert_privacy_policy nedobot-pvo
          assert_no_journal_errors nedobot-pvo

          podman exec tg-ai-bot-postgres psql -v ON_ERROR_STOP=1 \
            -U tg_ai_bot -d tg_ai_bot \
            -c 'GRANT SELECT (chat_id, message_id, embedding, embedding_model, status) ON TABLE public.telegram_message_embeddings_gemma2 TO nedobot_mcp_ro'
          systemctl restart nedonews-mcp
          wait_for_unit_binary nedonews-mcp "$expected_mcp_sha" "$mcp_restarts_before"
          assert_no_journal_errors tg-ai-bot-teloxide nedobot-pvo nedonews-mcp
          deployment_complete=true
          REMOTE
