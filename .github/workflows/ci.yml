name: CI

on:
  push:
    branches: [main, dev, "agent/**", "codex/**", "migration/teloxide-0.18"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm
        env:
          POSTGRES_DB: tg_ai_bot_test
          POSTGRES_USER: tg_ai_bot_dev
          POSTGRES_PASSWORD: tg_ai_bot_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tg_ai_bot_dev -d tg_ai_bot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check release installer isolation and concurrency
        run: |
          python3 tests/release_install.py
          python3 tests/reviewed_spam_training.py
          python3 tests/test_cargo_test_checked.py

      - name: Prepare PostgreSQL integration databases and read-only role
        env:
          PGPASSWORD: tg_ai_bot_dev
        run: |
          psql -h 127.0.0.1 -U tg_ai_bot_dev -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE tg_ai_bot_test_b'
          psql -h 127.0.0.1 -U tg_ai_bot_dev -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE tg_ai_bot_corpus_a' \
            -c 'CREATE DATABASE tg_ai_bot_corpus_b'
          psql -h 127.0.0.1 -U tg_ai_bot_dev -d tg_ai_bot_test -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'nedobot_mcp_ro') THEN CREATE ROLE nedobot_mcp_ro NOLOGIN; END IF; END \$\$" \
            -c 'GRANT nedobot_mcp_ro TO tg_ai_bot_dev'

      - name: Run tests
        run: python3 scripts/run_cargo_test_checked.py cargo test --workspace --all-targets --locked

      - name: Verify RC1 to RC2 stored-message rollback compatibility
        run: cargo test --manifest-path testing/rc1-compat/Cargo.toml --locked

      - name: Compile isolated bounded fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --locked

      - name: Check supported default and feature-disabled config matrix
        run: sh scripts/test_feature_matrix.sh

      - name: Run deterministic adversarial harness and synthetic corpus
        env:
          NEDOBOT_PROPTEST_SEED: "72623859790382856"
        run: python3 scripts/run_cargo_test_checked.py cargo test --test adversarial_harness --locked -- --nocapture

      - name: Test no-default feature set
        run: python3 scripts/run_cargo_test_checked.py cargo test --no-default-features --workspace --all-targets --locked

      - name: Check no-default feature set
        run: cargo check --no-default-features --workspace --all-targets --locked

      - name: Check opt-in flood shadow build
        run: cargo check --no-default-features --features flood --all-targets --locked

      - name: Verify default build does not enable flood core
        run: |
          if cargo tree --locked -e features -i teloxide-antispam | grep -F 'feature "flood"'; then
            echo 'default build unexpectedly enables teloxide-antispam/flood'
            exit 1
          fi

      - name: Test Telegram flood shadow projection
        run: python3 scripts/run_cargo_test_checked.py cargo test --locked --no-default-features --features flood --lib features::flood_shadow

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Apply PostgreSQL migrations
        env:
          DATABASE_URL: postgres://tg_ai_bot_dev:tg_ai_bot_dev@127.0.0.1:5432/tg_ai_bot_test
          TEST_DATABASE_URL_B: postgres://tg_ai_bot_dev:tg_ai_bot_dev@127.0.0.1:5432/tg_ai_bot_test_b
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          cargo run --locked --bin migrate
          DATABASE_URL="$TEST_DATABASE_URL_B" cargo run --locked --bin migrate

      - name: Run URL evidence PostgreSQL integration test
        env:
          TEST_DATABASE_URL: postgres://tg_ai_bot_dev:tg_ai_bot_dev@127.0.0.1:5432/tg_ai_bot_test
        run: python3 scripts/run_cargo_test_checked.py cargo test --locked --lib db::url_evidence::tests::database_evidence_is_redacted_replaceable_and_backfillable -- --ignored --exact

      - name: Run URL shadow privacy PostgreSQL integration test
        env:
          TEST_DATABASE_URL: postgres://tg_ai_bot_dev:tg_ai_bot_dev@127.0.0.1:5432/tg_ai_bot_test
        run: python3 scripts/run_cargo_test_checked.py cargo test --locked --lib features::new_user_analysis::tests::url_shadow_observations_are_separate_and_private -- --ignored --exact

      - name: Run URL shadow lock PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://tg_ai_bot_dev:tg_ai_bot_dev@127.0.0.1:5432/tg_ai_bot_test
        run: |
          python3 scripts/run_cargo_test_checked.py cargo test --locked --lib features::new_user_analysis::tests::url_shadow_lock_serializes_same_user_without_blocking_other_users -- --ignored --exact
          python3 scripts/run_cargo_test_checked.py cargo test --locked --lib features::new_user_analysis::tests::cancelled_url_shadow_refresh_releases_its_session_lock -- --ignored --exact
          python3 scripts/run_cargo_test_checked.py cargo test --locked --lib features::new_user_analysis::tests::qr_only_evidence_refreshes_shadow_and_removed_links_clear_positive_state -- --ignored --exact

      - name: Run URL inventory privacy and label PostgreSQL integration test
        env:
          TEST_DATABASE_URL: postgres://tg_ai_bot_dev:tg_ai_bot_dev@127.0.0.1:5432/tg_ai_bot_test
        run: python3 scripts/run_cargo_test_checked.py cargo test --locked --bin export_url_inventory tests::export_separates_current_flags_from_latest_operator_labels -- --ignored --exact

      - name: Run Telegram username alias PostgreSQL integration test
        env:
          TEST_DATABASE_URL: postgres://tg_ai_bot_dev:tg_ai_bot_dev@127.0.0.1:5432/tg_ai_bot_test
        run: python3 scripts/run_cargo_test_checked.py cargo test --locked --lib features::url_relations::tests::current_username_aliases_resolve_only_fresh_unique_owners -- --ignored --exact

      - name: Run PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://tg_ai_bot_dev:tg_ai_bot_dev@127.0.0.1:5432/tg_ai_bot_test
          RUST_MIN_STACK: 8388608
        run: |
          python3 scripts/run_cargo_test_checked.py cargo test --locked --features flood --lib features::flood_shadow::tests::observer_reads_only_the_requested_chat_and_topic -- --ignored --exact
          python3 scripts/run_cargo_test_checked.py cargo test --locked --test postgres_migrations -- --ignored
          python3 scripts/run_cargo_test_checked.py cargo test --locked --test adversarial_harness post_comment_sql_matches_reference_lease_and_delivery_trace -- --ignored --exact
          python3 scripts/run_cargo_test_checked.py cargo test --locked --test adversarial_harness generated_post_comment_claims_reject_stale_and_duplicate_delivery -- --ignored --exact
          python3 scripts/run_cargo_test_checked.py cargo test --locked --lib features::user_profiles::enrichment::tests::saturated_and_closed_queue_preserves_ingested_audit_intents -- --ignored --exact
          python3 scripts/run_cargo_test_checked.py cargo test --locked --lib features::user_profiles::enrichment::tests::two_chats_share_profile_fetch_but_keep_both_audits -- --ignored --exact
          python3 scripts/run_cargo_test_checked.py cargo test --locked --lib features::user_profiles::enrichment::tests::fast_audit_ack_fences_revisions_and_reclaims -- --ignored --exact
          python3 scripts/run_cargo_test_checked.py cargo test --locked --lib features::qr_url::tests::qr_worker_persists_fresh_alias_relation_and_rejects_superseded_media -- --ignored --exact
          python3 scripts/run_cargo_test_checked.py cargo test --locked --lib telegram::manual_moderation::tests::username_sanctions_require_live_ownership_and_resume_preserves_provenance -- --ignored --exact
          python3 scripts/run_cargo_test_checked.py cargo test --locked --lib features::voice::pipeline::tests::voice_partial_delivery_is_persisted_and_never_replayed_after_restart -- --ignored --exact

      - name: Validate synthetic public URL corpus
        run: |
          python3 scripts/validate_public_url_corpus.py
          python3 -m unittest discover -s tests -p 'test_public_url_corpus.py'

      - name: Run isolated synthetic history extraction across two databases
        env:
          TEST_PRIVATE_HISTORY_DATABASE_URL_A: postgres://tg_ai_bot_dev:tg_ai_bot_dev@127.0.0.1:5432/tg_ai_bot_corpus_a
          TEST_PRIVATE_HISTORY_DATABASE_URL_B: postgres://tg_ai_bot_dev:tg_ai_bot_dev@127.0.0.1:5432/tg_ai_bot_corpus_b
        run: python3 scripts/run_cargo_test_checked.py cargo test --locked --test private_url_history two_synthetic_databases_extract_only_their_scoped_messages_and_qr_hashes -- --ignored --exact

      - name: Run RMCP PostgreSQL integration test
        env:
          TEST_DATABASE_URL: postgres://tg_ai_bot_dev:tg_ai_bot_dev@127.0.0.1:5432/tg_ai_bot_test
          TEST_DATABASE_URL_B: postgres://tg_ai_bot_dev:tg_ai_bot_dev@127.0.0.1:5432/tg_ai_bot_test_b
        run: python3 scripts/run_cargo_test_checked.py cargo test --locked --test chat_db_mcp -- --ignored

      - name: Run manual moderation PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://tg_ai_bot_dev:tg_ai_bot_dev@127.0.0.1:5432/tg_ai_bot_test
        run: python3 scripts/run_cargo_test_checked.py cargo test --locked --test manual_moderation -- --ignored
