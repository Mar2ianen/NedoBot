worker_processes auto;
events { worker_connections 1024; }

stream {
    map $ssl_preread_server_name $tls_backend {
        nedobot.chickenkiller.com nedobot_tls;
        qwoljs.mooo.com naive_tls;
        default reality_tls;
    }

    upstream nedobot_tls { server 127.0.0.1:9445; }
    upstream naive_tls { server 127.0.0.1:9444; }
    upstream reality_tls { server 127.0.0.1:1443; }

    server {
        listen 443;
        proxy_pass $tls_backend;
        ssl_preread on;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    limit_req_zone $binary_remote_addr zone=nedonews_mcp_requests_per_ip:10m rate=300r/m;
    limit_conn_zone $binary_remote_addr zone=nedonews_mcp_connections_per_ip:10m;
    limit_conn_zone $server_name zone=nedonews_mcp_connections_global:1m;
    server_tokens off;

    server {
        listen 80;
        server_name qwoljs.mooo.com;
        root /usr/share/nginx/html;
        index index.html;
        location / { try_files $uri $uri/ =404; }
    }

    server {
        listen 80;
        server_name nedobot.chickenkiller.com;
        root /usr/share/nginx/html;
        location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
        location / { return 308 https://$host$request_uri; }
    }

    server {
        listen 9443 ssl;
        http2 on;
        server_name qwoljs.mooo.com simple.wikipedia.org;
        ssl_certificate /etc/sing-box/hy2.crt;
        ssl_certificate_key /etc/sing-box/hy2.key;
        root /usr/share/nginx/html;
        index index.html;
        location / { try_files $uri $uri/ =404; }
    }

    server {
        listen 9445 ssl;
        http2 on;
        server_name nedobot.chickenkiller.com;
        ssl_certificate /etc/letsencrypt/live/nedobot.chickenkiller.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nedobot.chickenkiller.com/privkey.pem;
        add_header X-Content-Type-Options nosniff always;

        location ^~ /tg-ai-bot-static/avatars/ {
            alias /srv/nedobot-static/avatars/;
            try_files $uri =404;
            limit_except GET HEAD { deny all; }
            add_header Cache-Control "public, max-age=604800, immutable" always;
        }

        location = /mcp/nedonews/v2 {
            proxy_pass http://127.0.0.1:8787/mcp/nedonews/v2;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            limit_req zone=nedonews_mcp_requests_per_ip burst=600 nodelay;
            limit_req_status 429;
            limit_conn nedonews_mcp_connections_per_ip 40;
            limit_conn nedonews_mcp_connections_global 8;
            limit_conn_status 429;

            proxy_buffering off;
            proxy_cache off;
            client_max_body_size 64k;
            client_body_timeout 15s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            # Приложение формирует контролируемый 408 за 60 секунд раньше proxy timeout.
            proxy_read_timeout 70s;
        }

        location / { return 404; }
    }
}
