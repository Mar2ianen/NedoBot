[workspace]
members = [".", "crates/agent-runtime"]

[package]
name = "tg_ai_bot_teloxide"
version = "0.12.0"
edition = "2024"
license = "MIT"

[features]
# The default feature set is the single release profile: every instance runs
# the same binary and differs by runtime config only (llm_profiles.toml plus
# env secrets). Keep community-only builds explicit via --no-default-features
# and fail-fast when config requests a missing application module.
default = [
    "auto-comment",
    "ask",
    "voice",
    "public-mcp",
    "moderation",
    "spam-sync",
    "manual-moderation",
]
auto-comment = []
ask = []
voice = []
public-mcp = []
moderation = []
spam-sync = []
manual-moderation = []

[[bin]]
name = "chat_db_mcp"
path = "src/bin/chat_db_mcp.rs"
required-features = ["public-mcp"]

[[bin]]
name = "nedonews_mcp_http"
path = "src/bin/nedonews_mcp_http.rs"
required-features = ["public-mcp"]

[[bin]]
name = "voice_smoke"
path = "src/bin/voice_smoke.rs"
required-features = ["voice"]

[[bin]]
name = "retry_pending_comments"
path = "src/bin/retry_pending_comments.rs"
required-features = ["auto-comment"]

[[bin]]
name = "reconcile_comment_delivery"
path = "src/bin/reconcile_comment_delivery.rs"
required-features = ["auto-comment"]

[[test]]
name = "chat_db_mcp"
path = "tests/chat_db_mcp.rs"
required-features = ["ask", "public-mcp"]

[[test]]
name = "postgres_migrations"
path = "tests/postgres_migrations.rs"
required-features = ["auto-comment", "ask", "voice", "moderation"]

[[test]]
name = "manual_moderation"
path = "tests/manual_moderation.rs"
required-features = ["manual-moderation"]

[[test]]
name = "rmcp_transport"
path = "tests/rmcp_transport.rs"
required-features = ["public-mcp"]

[dependencies]
agent-runtime = { path = "crates/agent-runtime" }
anyhow = "1"
axum = "0.8"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
jiff = "0.2"
dotenvy = "0.15"
teloxide-antispam = { git = "https://github.com/Mar2ianen/teloxide-antispam", rev = "0b3aab1c8ae1591f00a7fb5747dc828126653e32", default-features = false, features = ["scoring", "classifier", "embedding", "cas"] }
teloxide-statistics = { git = "https://github.com/Mar2ianen/teloxide-statistics", rev = "7e2a5859849044121b9e693bc1ed36e7440db139", default-features = false, features = ["sentiment", "engagement", "reputation"] }
genai = { version = "=0.6.5", default-features = false, features = ["native-tls"] }
reqwest = { version = "0.13", features = ["json", "multipart", "query", "socks"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "client", "macros", "schemars", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "sqlite", "chrono", "uuid"] }
teloxide = { git = "https://github.com/Mar2ianen/teloxide-fork", rev = "1c33feff884aa82958625e0bd718267689cb7683", features = ["macros", "drafter", "rich-text", "time-rendering"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-std", "io-util", "process", "sync", "time", "test-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
