[package]
name = "tg_ai_bot_teloxide"
version = "0.12.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
jiff = "0.2"
dotenvy = "0.15"
genai = { version = "=0.6.5", default-features = false, features = ["native-tls"] }
reqwest = { version = "0.13", features = ["json", "multipart", "socks"] }
rmcp = { version = "=3.0.0-beta.3", default-features = false, features = ["server", "client", "macros", "schemars", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "uuid"] }
teloxide = { git = "https://github.com/Mar2ianen/teloxide-fork", rev = "a7364c69a6cfd553133c2b89d19f44f2718e377a", features = ["macros", "drafter", "rich-text"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-std", "io-util", "process", "sync", "time", "test-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
