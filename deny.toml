[advisories]
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "Temporary, narrowly scoped exception: SQLx 0.9.0 caps libsqlite3-sys below the patched 0.39 line. Keep SQLite behavior unchanged and use SQLx's bundled SQLite. The advisory requires an attacker-controlled database and sibling WAL file; the reputation DB and WAL are in a service-user-owned 0700 directory, mode 0600, and are written only by the two trusted bot processes. Telegram/user content cannot select or write these files. Revisit when SQLx accepts libsqlite3-sys >=0.39; do not ignore other advisories." },
]

[licenses]
# Exact SPDX identifiers present in the locked dependency graph. Keep this
# explicit so new licenses require review instead of silently passing.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
